name: Datasource CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Ruff and non-live pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout datasource
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Test (ratchet gate)
        # addopts carries --cov; --cov-fail-under is explicit on the CLI because
        # pytest-cov does not reliably exit non-zero from addopts (issue #728).
        run: uv run pytest -m "not live" --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datasource-coverage
          path: |
            .coverage
            coverage-summary.json

  image:
    name: Build and smoke datasource image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout datasource
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: mist-datasource:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke both container entrypoints
        run: bash scripts/test-container-entrypoints.sh "mist-datasource:${GITHUB_SHA}"

      - name: Publish immutable image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mist-trade/mist-datasource:${{ github.sha }}
          cache-from: type=gha
