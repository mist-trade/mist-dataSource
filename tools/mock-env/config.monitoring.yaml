# Exporter config for the local mock verification stack (all 127.0.0.1).
# Shape follows mist-monitoring config.example.yaml.
#
# TODO(shrink-monitoring-to-blackbox-probe): after the shrink the exporter only
# supports strategy_redis targets; HTTP/datasource targets were removed. The
# whitebox rebuild restores per-service probing via service /metrics.
listen:
  host: 127.0.0.1
  port: 9109

targets:
  # Local realtime/strategy Redis (mock stack container) bounded RESP probe.
  - name: realtime-strategy-redis
    address: 127.0.0.1:6379
    timeout_ms: 1000
    strategy_redis: true
